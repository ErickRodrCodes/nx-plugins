name: Main Workflow

on:
  push:
    branches:
      - main
      - develop
      - 'feature/*'
      - 'releases/**'
      - 'hotfix/**'
      - 'bugfix/**'
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Needed for nx-set-shas when run on the main branch
permissions:
  actions: read
  contents: read

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  # Build and test on Ubuntu
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      dist_found: ${{ steps.check_dist.outputs.found }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Derive appropriate SHAs for base and head for `nx affected` commands
      - name: Derive SHAs for nx affected
        uses: nrwl/nx-set-shas@v4

      # Record non-Nx commands to Nx Cloud
      # - name: Check formatting
      #   run: pnpm nx-cloud record -- pnpm nx format:check

      # Use affected commands to only run tasks for changed projects
      - name: Build and linting affected packages
        run: pnpm nx affected -t build lint

      - name: Run affected unit tests
        run: pnpm nx affected -t test --exclude=smoke-tests

  # Smoke tests on Windows (headless)
  smoke-tests-windows:
    runs-on: windows-latest
    needs: build-and-test
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Setup smoke tests
        run: pnpm run smoke:setup

      - name: Run smoke tests (headless)
        run: pnpm nx run smoke-tests:test
        env:
          CI: true
          ELECTRON_ENABLE_LOGGING: false

  # SonarQube analysis
  sonarqube:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
        with:
          # Disabling shallow clones is recommended for improving the relevancy of reporting
          fetch-depth: 0
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: -Dsonar.test.exclusions=packages/**/*.spec.ts;smoke-tests/**/*.spec.ts

      - name: SonarQube Quality Gate check
        id: sonarqube-quality-gate-check
        uses: sonarsource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show SonarQube Quality Gate Status
        run: echo "The Quality Gate status is ${{ steps.sonarqube-quality-gate-check.outputs.quality-gate-status }}"
