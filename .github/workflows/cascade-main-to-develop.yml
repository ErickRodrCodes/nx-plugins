name: cascade-main-to-develop

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  backmerge:
    runs-on: ubuntu-latest
    steps:
      - name: Create PR main -> develop if missing
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            // 1) Check for existing open PR: head=owner:main, base=develop
            const prs = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              base: "develop",
              head: `${owner}:main`,
              per_page: 1,
            });

            if (prs.data.length > 0) {
              core.info(`PR already open: #${prs.data[0].number}`);
              return;
            }

            // 2) Create it
            const created = await github.rest.pulls.create({
              owner,
              repo,
              title: "chore: back-merge main into develop",
              head: "main",
              base: "develop",
              body: "Automated cascade PR to keep develop aligned with main.",
            });

            core.info(`Created PR: #${created.data.number}`);
