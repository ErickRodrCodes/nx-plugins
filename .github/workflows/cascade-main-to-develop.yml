name: cascade-main-to-develop

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  backmerge:
    runs-on: ubuntu-latest
    steps:
      - name: Create or reuse PR from main -> develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          existing="$(gh pr list --base develop --head main --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            echo "PR already open: #$existing"
            exit 0
          fi

          gh pr create \
            --base develop \
            --head main \
            --title "chore: back-merge main into develop" \
            --body "Automated cascade PR to keep develop aligned with main."
