name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Perform a dry run (no actual publish)"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Needed for nx-set-shas and release
permissions:
  actions: read
  contents: write
  id-token: write

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  # Build and test on Ubuntu
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # For release, we build all packages (not just affected)
      - name: Build all packages
        run: pnpm nx run-many -t build --parallel 4

      - name: Run all unit tests
        run: pnpm nx run-many -t test --parallel 4

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist/packages/
          retention-days: 1

  # Smoke tests on Windows (headless)
  smoke-tests-windows:
    runs-on: windows-latest
    needs: build-and-test
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-packages
          path: dist/packages/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup smoke tests
        run: pnpm run smoke:setup

      - name: Run smoke tests (headless)
        run: pnpm nx run smoke-tests:test
        env:
          # Run in headless mode for CI
          CI: true
          # Disable interactive prompts
          ELECTRON_ENABLE_LOGGING: false
          # Use virtual framebuffer for headless Electron
          DISPLAY: ":99"

  # Release to npm
  release:
    runs-on: ubuntu-latest
    # TODO: Re-add smoke-tests-ubuntu once Ubuntu headless Electron is working
    needs: [smoke-tests-windows]
    # needs: [smoke-tests-windows, smoke-tests-ubuntu]
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-packages
          path: dist/packages/

      - name: Release (Dry Run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: pnpm nx release --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: pnpm nx release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
